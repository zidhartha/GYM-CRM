spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: test
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  activemq:
    broker-url: vm://embedded?broker.persistent=false
    user: admin
    password: admin
  security:
    oauth2:
      client:
        registration:
          gym-main:
            client-id: gym-main
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: report:write,report:read
        provider:
          gym-main:
            token-uri: http://localhost:9999/oauth2/token

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: TEST_SECRET_KEY_WHICH_IS_DEFINITELY_MORE_THAN_32_CHARACTERS_LONG
    expiration: 86400000

auth:
  max-attempts: 3
  block-duration-minutes: 5

seed:
  file:
    path: classpath:seed-data.json

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS